
name: Publicar versión

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - protect.js
      - .github/workflows/publicar.yml

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Proteger aplicación
        run: node protect.js

      - name: Preparar publicación
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "El tag $TAG ya existe."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Compilar y publicar Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Mostrar versión publicada
        run: echo "Versión compilada: ${{ env.VERSION }}"
